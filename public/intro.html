<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:'Noto Sans Bengali',Arial,sans-serif}
.stage{position:fixed;inset:0;overflow:hidden;background:#050505;color:#fff}
.scene,.preloader{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scene{opacity:0;transition:opacity .3s ease}
.scene.active{opacity:1}
.preloader{z-index:5;transition:opacity .45s ease}
.preloader.done{opacity:0;pointer-events:none}
.portal{position:absolute;z-index:4;inset:0;width:100%;height:100%;pointer-events:none}
.brand{position:absolute;z-index:8;left:50%;top:50%;transform:translate(-50%,-50%);color:white;font-weight:800;font-size:clamp(17px,2.2vw,22px);letter-spacing:.14em;white-space:nowrap;transition:left .72s cubic-bezier(.16,1,.3,1),top .72s cubic-bezier(.16,1,.3,1),transform .72s cubic-bezier(.16,1,.3,1);text-shadow:0 2px 20px #0008}
.brand span{display:block;margin-top:5px;color:#ff7a00;font-size:9px;letter-spacing:.38em}
.brand.docked{left:5vw;top:23px;transform:none}
.skip{position:absolute;z-index:10;right:22px;top:20px;padding:10px 16px;border:1px solid #ffffff80;border-radius:999px;background:#09080770;color:#fff;backdrop-filter:blur(12px);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.skip:focus-visible{outline:2px solid #ff7a00;outline-offset:3px}
.progress{position:absolute;z-index:7;left:50%;bottom:28px;transform:translateX(-50%);font-size:48px;font-weight:200;letter-spacing:-.06em;color:#fff}
.progress small{font-size:18px;letter-spacing:0}
.shade{position:absolute;z-index:2;inset:0;pointer-events:none;background:linear-gradient(transparent 50%,#0008)}
.scene-caption{position:absolute;z-index:7;left:50%;bottom:clamp(76px,11vh,112px);transform:translateX(-50%);width:min(560px,86vw);text-align:center;text-shadow:0 2px 22px #000;opacity:0;transition:opacity .45s ease;pointer-events:none}.scene-caption.visible{opacity:1}.scene-caption small{display:block;color:#ffb36f;font-size:10px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;margin-bottom:10px}.scene-caption strong{display:block;font-size:clamp(20px,3.2vw,34px);font-weight:600;letter-spacing:-.035em}.stage.mobile-mode{background:radial-gradient(ellipse at 50% 44%,#743b20 0%,#21130f 34%,#050505 74%)}.stage.mobile-mode .scene,.stage.mobile-mode .preloader,.stage.mobile-mode .portal{display:none}.stage.mobile-mode .brand{font-size:clamp(20px,6vw,28px)}.stage.mobile-mode .brand span{font-size:10px}.stage.mobile-mode .progress{display:none}.stage.mobile-mode .scene-caption{bottom:calc(50% - 94px);opacity:1}.stage.mobile-mode .brand{top:50%;}
@media(max-width:640px){.skip{top:14px;right:14px;padding:9px 13px}.brand.docked{left:5vw;top:19px}}
@media(prefers-reduced-motion:reduce){.scene,.preloader,.brand{transition:none!important}}

.mascot-reveal{position:absolute;z-index:9;right:5%;top:50%;width:min(47vw,660px);aspect-ratio:1;transform:translateY(-50%);opacity:0;transition:opacity .85s cubic-bezier(.16,1,.3,1)}
.mascot-reveal .hero-art-frame{position:absolute;inset:10%;border:0;transform:rotate(-12deg) rotateY(-18deg);transform-style:preserve-3d;animation:explorer-float 6s ease-in-out infinite alternate}
.mascot-reveal .hero-art-frame:before,.mascot-reveal .hero-art-frame:after{content:"";position:absolute;inset:10%;border:1px solid rgba(255,99,0,.24);border-radius:50%;transform:translateZ(34px) rotate(8deg)}
.mascot-reveal .hero-art-frame:after{inset:22% -7%;border-color:rgba(180,198,214,.16);transform:translateZ(-30px) rotate(-15deg)}
.mascot-reveal .hero-art-core{position:absolute;inset:24%;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 48%,rgba(255,99,0,.18),transparent 64%);border:0;box-shadow:none;transform:translateZ(55px) rotate(8deg);overflow:visible}
.mascot-reveal .swapno-mascot{width:100%;height:100%;filter:drop-shadow(0 28px 36px rgba(0,0,0,.36))}
@keyframes explorer-float{from{translate:0 -7px}to{translate:0 9px}}
.stage.handoff{background:radial-gradient(ellipse at 76% 48%,rgba(255,99,0,.12),transparent 34%),#0B0F14}
.stage.handoff .scene,.stage.handoff .preloader,.stage.handoff .portal,.stage.handoff .shade,.stage.handoff .progress,.stage.handoff .scene-caption{opacity:0!important}
.stage.handoff .mascot-reveal{opacity:1}
.stage.handoff .brand{left:5.5vw;top:28px;transform:none}
@media(max-width:760px){.mascot-reveal{right:-20%;top:66%;width:68vw;transform:translateY(-50%)}.stage.mobile-mode .mascot-reveal{opacity:1}.stage.mobile-mode .scene-caption{bottom:calc(50% + 50px)}.stage.mobile-mode .brand{top:calc(50% - 70px)}}
@media(prefers-reduced-motion:reduce){.mascot-reveal{transition:none!important}}
</style>
</head>
<body>
<div class="stage" id="stage">
<video class="scene active" id="mars" muted playsinline preload="none" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4"></video>

<video class="preloader" id="preloader" muted playsinline preload="metadata" src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4"></video>

<div class="shade"></div><div class="mascot-reveal" aria-hidden="true"><div class="hero-art-frame"><div class="hero-art-core"><svg class="swapno-mascot" viewBox="0 0 520 620" ><defs><linearGradient id="suit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F4F6F8"/><stop offset=".48" stop-color="#8795A4"/><stop offset="1" stop-color="#263442"/></linearGradient><linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9BCAD8"/><stop offset=".42" stop-color="#294052"/><stop offset="1" stop-color="#101923"/></linearGradient></defs><ellipse cx="260" cy="586" rx="168" ry="18" fill="#000" opacity=".24"/><path d="M105 605c9-105 60-164 155-176 96 12 147 71 155 176H105Z" fill="url(#suit)" stroke="#E8EDF2" stroke-width="3"/><path d="M150 605c12-72 48-115 110-125 62 10 98 53 110 125" fill="#202B37" stroke="#FF6300" stroke-width="5"/><path d="M211 446h98l27 94-76 48-76-48 27-94Z" fill="#344352" stroke="#B8C4CF" stroke-width="3"/><path d="M231 472h58l18 47-47 29-47-29 18-47Z" fill="#101A24" stroke="#FF6300" stroke-width="3"/><circle cx="260" cy="499" r="12" fill="#FF6300"/><path d="M194 103c15-51 53-79 105-79 54 0 93 32 105 86l8 94c4 76-53 139-130 139s-134-63-130-139l8-101Z" fill="url(#suit)" stroke="#E8EDF2" stroke-width="5"/><path d="M174 164c9-61 44-96 100-102 63-6 109 29 122 89l-6 63c-7 57-51 98-113 98-61 0-104-41-111-98l8-50Z" fill="url(#visor)" stroke="#FF8738" stroke-width="7"/><path d="M191 158c25-43 58-65 102-69 37-4 69 8 90 34-41 7-75 26-103 58-25 28-54 42-89 43v-66Z" fill="#D9F2FA" opacity=".16"/><path d="M190 225c42-4 79-24 112-59 22-23 45-38 72-46" fill="none" stroke="#A6D8E6" stroke-opacity=".6" stroke-width="5" stroke-linecap="round"/><circle cx="168" cy="199" r="16" fill="#344352" stroke="#FF6300" stroke-width="4"/><circle cx="352" cy="199" r="16" fill="#344352" stroke="#FF6300" stroke-width="4"/><path d="M183 101c25-38 61-57 108-57 47 0 84 22 107 64" fill="none" stroke="#FFF" stroke-opacity=".65" stroke-width="5"/><path d="M144 391c-4 27 3 49 24 66l40 26 24-38-31-36-57-18Zm232 0c4 27-3 49-24 66l-40 26-24-38 31-36 57-18Z" fill="#536272" stroke="#C4CED7" stroke-width="3"/><path d="M135 421l35 15m215-15-35 15" stroke="#FF6300" stroke-width="8" stroke-linecap="round"/></svg></div></div></div>
<div class="scene-caption" id="sceneCaption" aria-live="polite"><small id="sceneKicker">CREATIVE / 01</small><strong id="sceneTitle">Make it matter.</strong></div>
<div class="brand" id="brand">SWAPNO<span>TECH</span></div>
<div class="progress" id="progress">0<small>%</small></div>
<button class="skip" id="skip" type="button">Skip intro ↗</button>
</div>
<script>
(function(){
'use strict';
var lang=new URLSearchParams(location.search).get('lang')==='BN'?'BN':'EN';
document.documentElement.lang=lang==='BN'?'bn':'en';
var done=false,stage=document.getElementById('stage'),pre=document.getElementById('preloader'),brand=document.getElementById('brand'),progress=document.getElementById('progress'),caption=document.getElementById('sceneCaption'),captionKicker=document.getElementById('sceneKicker'),captionTitle=document.getElementById('sceneTitle'),canvas=document.getElementById('portal'),ctx=canvas.getContext('2d');
var scenes=[document.getElementById('mars'),document.getElementById('earth'),document.getElementById('venus')],w=0,h=0,dpr=1,active=0,raf=0;
function finish(){if(done)return;done=true;cancelAnimationFrame(raf);stage.style.transition='opacity .55s cubic-bezier(.16,1,.3,1)';stage.classList.add('handoff');requestAnimationFrame(function(){stage.style.opacity='0'});try{parent.postMessage({type:'SWAPNO_INTRO_DONE'},location.origin)}catch(e){}}
document.getElementById('skip').textContent=lang==='BN'?'ইন্ট্রো এড়িয়ে যান ↗':'Skip intro ↗';
document.getElementById('skip').addEventListener('click',finish);
function resize(){dpr=Math.min(devicePixelRatio||1,1.5);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);canvas.style.width=w+'px';canvas.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();
function cover(video){var vw=video.videoWidth||w,vh=video.videoHeight||h,s=Math.max(w/vw,h/vh),dw=vw*s,dh=vh*s;ctx.drawImage(video,(w-dw)/2,(h-dh)/2,dw,dh)}
function roundedRectPoints(w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));var corners=[[w/2-r,-h/2+r,-Math.PI/2,0],[w/2-r,h/2-r,0,Math.PI/2],[-w/2+r,h/2-r,Math.PI/2,Math.PI],[-w/2+r,-h/2+r,Math.PI,Math.PI*1.5]],points=[];corners.forEach(function(c){for(var i=0;i<=10;i++){var a=c[2]+(c[3]-c[2])*i/10;points.push([c[0]+Math.cos(a)*r,c[1]+Math.sin(a)*r])}});return points}
function rounded(x,y,rw,rh,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+rw,y,x+rw,y+rh,r);ctx.arcTo(x+rw,y+rh,x,y+rh,r);ctx.arcTo(x,y+rh,x,y,r);ctx.arcTo(x,y,x+rw,y,r);ctx.closePath()}
function portalTransition(nextIndex){
 return new Promise(function(resolve){
  var outgoing=scenes[active],incoming=scenes[nextIndex],start=performance.now(),duration=700,videoReady=false;
  incoming.pause();incoming.currentTime=0;incoming.playbackRate=2.1;incoming.load();
  var settle=setTimeout(function(){videoReady=true;incoming.play().catch(function(){});},80);
  function frame(now){
   if(done){clearTimeout(settle);resolve();return}
   var t=Math.min(1,(now-start)/duration),e=1-Math.pow(1-t,3);
   ctx.clearRect(0,0,w,h);
   var rw=Math.min(330,w*.66),rh=Math.min(360,h*.58),x=(w-rw)/2,y=(h-rh)/2;
   var cx=w/2,cy=h/2,ww=rw+(w-rw)*e,hh=rh+(h-rh)*e,xx=cx-ww/2,yy=cy-hh/2,rad=86*(1-e);
   ctx.save();ctx.translate(cx,cy);ctx.rotate((1-e)*-.055);ctx.translate(-cx,-cy);
   var points=roundedRectPoints(ww,hh,rad);ctx.beginPath();points.forEach(function(point,i){var px=point[0],py=point[1],z=px*.035-py*.025,p=850/(850+z),sx=cx+px*p,sy=cy+py*p;if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy)});ctx.closePath();ctx.clip();ctx.fillStyle='#050505';ctx.fillRect(0,0,w,h);
   if(incoming.readyState>=2)cover(incoming);
   ctx.restore();
   if(t<1)requestAnimationFrame(frame);
   else{outgoing.pause();outgoing.classList.remove('active');incoming.classList.add('active');active=nextIndex;canvas.style.opacity='0';setTimeout(function(){ctx.clearRect(0,0,w,h);canvas.style.opacity='1';resolve()},100)}
  }
  canvas.style.opacity='1';requestAnimationFrame(frame);
 });
}
function setChapter(index){var chapters=lang==='BN'?[['সৃজনশীলতা / ০১','কাজকে অর্থবহ করুন।'],['প্রযুক্তি / ০২','আগামীর জন্য তৈরি করুন।'],['প্রবৃদ্ধি / ০৩','উদ্দেশ্য নিয়ে এগিয়ে চলুন।']]:[['CREATIVE / 01','Make it matter.'],['TECHNOLOGY / 02','Build for tomorrow.'],['GROWTH / 03','Move with purpose.']];var item=chapters[index]||chapters[0];captionKicker.textContent=item[0];captionTitle.textContent=item[1];caption.classList.add('visible');}
async function start(){
 if(done)return;
 pre.classList.add('done');brand.classList.add('docked');setChapter(0);
 scenes[0].play().catch(function(){});
 await new Promise(function(r){setTimeout(r,120)});
 await portalTransition(1);
 if(done)return;
 setChapter(1);scenes[1].play().catch(function(){});
 await new Promise(function(r){setTimeout(r,80)});
 await portalTransition(2);
 if(done)return;
 setChapter(2);scenes[2].play().catch(function(){});
  stage.classList.add('handoff');
 await new Promise(function(r){setTimeout(r,1050)});
 finish();
}
var began=false;
function begin(){if(began||done)return;began=true;var duration=pre.duration||6;pre.playbackRate=Math.max(2.2,duration/1.1);pre.play().catch(function(){});var startAt=performance.now();function count(){if(done)return;var p=Math.min(100,Math.round((performance.now()-startAt)/1100*100));progress.innerHTML=p+'<small>%</small>';if(p<100)requestAnimationFrame(count)}requestAnimationFrame(count);setTimeout(start,1150)}
var isSmall=window.matchMedia('(max-width: 760px)').matches;
var reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if(reduced){finish();return;}
if(isSmall){stage.classList.add('mobile-mode');caption.classList.add('visible');captionKicker.textContent=lang==='BN'?'সৃজনশীল প্রযুক্তি':'CREATIVE TECHNOLOGY';captionTitle.textContent=lang==='BN'?'সম্ভাবনা থেকে অগ্রযাত্রা।':'Possibilities into progress.';setTimeout(function(){brand.classList.add('docked');},180);setTimeout(finish,1900);}
else{if(pre.readyState>=1)begin();else{pre.addEventListener('loadedmetadata',begin,{once:true});pre.addEventListener('error',begin,{once:true});setTimeout(begin,1000)}}
setTimeout(finish,7600);
})();
</script>
